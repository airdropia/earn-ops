name: bounty watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const repos = [
              { owner: "elizaOS", repo: "eliza", name: "eliza" },
              { owner: "SlopDotCash", repo: "slopdotcash", name: "slopdotcash" },
            ];
            const octokit = require("@octokit/rest");
            const gh = new octokit({ auth: process.env.GITHUB_TOKEN });
            const lines = [];
            for (const r of repos) {
              const { data: issues } = await gh.issues.listForRepo({
                owner: r.owner, repo: r.repo, state: "open", per_page: 60,
              });
              const candidates = issues.filter((i) => !i.pull_request && i.title.length > 12);
              lines.push(`## ${r.owner}/${r.repo} - ${candidates.length} open issues`);
              for (const i of candidates.slice(0, 25)) {
                lines.push(`- #${i.number} ${i.title}`);
              }
              lines.push("");
            }
            const { data: prs } = await gh.pulls.list({
              owner: "elizaOS", repo: "eliza", state: "open", head: "airdropia:fix/openai-rate-limit-trajectory-record",
            });
            lines.push("## our pull requests");
            for (const p of prs) {
              lines.push(`- #${p.number} ${p.title} (${p.html_url}) draft=${p.draft}`);
            }
            const body = `Automated digest ${new Date().toISOString()}\n\n${lines.join("\n")}\n`;
            const title = `bounty digest ${new Date().toISOString().slice(0, 10)}`;
            const { data: issues } = await gh.issues.listForRepo({
              owner: "airdropia", repo: "earn-ops", state: "open", per_page: 50,
            });
            const same = issues.find((i) => i.title === title);
            if (same) {
              await gh.issues.update({ owner: "airdropia", repo: "earn-ops", issue_number: same.number, body });
            } else {
              await gh.issues.create({ owner: "airdropia", repo: "earn-ops", title, body });
            }
            console.log(body);
